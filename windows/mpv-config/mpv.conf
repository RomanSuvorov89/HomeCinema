profile=high-quality
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
deband=yes
interpolation=no
volume=130
volume-max=300
slang=rus,ru
sid=auto
subs-with-matching-audio=yes
subs-fallback=no
subs-fallback-forced=no
save-position-on-quit=yes
keep-open=no
ontop=yes
autofit-larger=90%x90%
