services:
  poster-cache:
    build: .
    container_name: roman-poster-cache
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9121:9121"
    environment:
      LAMPAC_URL: "${LAMPAC_URL:-http://127.0.0.1:9118}"
      FAMILY_TOKEN: "${FAMILY_TOKEN:-home-family}"
    volumes:
      - ./data:/data
      - "${CATALOG_DIR:-../../server/data/recommender}:/catalog:rw"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9121/health"]
      interval: 30s
      timeout: 5s
      retries: 3
